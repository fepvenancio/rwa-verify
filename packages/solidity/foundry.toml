[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
# 0.8.35: the vendored ERC-8320 reference implementation (fixtures/erc8320) requires ^0.8.35.
solc = "0.8.35"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
allow_paths = ["../../fixtures"]
fs_permissions = [{ access = "read", path = "../../fixtures" }]
# FFI differential tests live in test/diff and only run under `--profile diff`.
no_match_path = "test/diff/*"

[fmt]
line_length = 120

# Tests, mocks and the fixture script are exercised, not shipped; their lint noise (calls in loops, unused returns,
# uint64(block.timestamp) casts) is by design. src/ is linted in full.
[lint]
ignore = ["test/**/*.sol", "script/**/*.sol"]
# Library entry points are "used once" by definition inside this package.
exclude_lints = ["internal-function-used-once"]

# Differential tests against external references (ADR-003). `forge test --profile diff`.
[profile.diff]
ffi = true
match_path = "test/diff/*"
no_match_path = "test/diff/.none"
fs_permissions = [{ access = "read", path = "../../fixtures" }, { access = "read-write", path = "out" }]

# Local fixture stack for the readers' e2e test (`pnpm test:e2e`, scripts/fixture-stack.sh). The script writes
# out/fixture-stack.json.
[profile.fixture]
fs_permissions = [{ access = "read", path = "../../fixtures" }, { access = "read-write", path = "out" }]
