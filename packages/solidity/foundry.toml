[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "../../fixtures" }]

[fmt]
line_length = 120

# Differential tests against Kula reference impls on a local Anvil (ADR-003).
[profile.diff]
ffi = true
